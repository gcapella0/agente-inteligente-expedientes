<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio — UNEG Expedientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>[x-cloak]{display:none!important}</style>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/ui/assets/app.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
<div id="navbar"></div>

<div x-data="dashApp()" x-init="init()" class="pt-16 px-6 pb-10 max-w-6xl mx-auto">

  <!-- Header -->
  <div class="mt-6 mb-4 flex items-center gap-3">
    <h1 class="text-xl font-semibold text-white">Inicio</h1>
    <span x-show="apiOnline === true" class="px-2 py-0.5 text-xs rounded-full bg-green-500/20 text-green-300 font-medium border border-green-500/30">● API online</span>
    <span x-show="apiOnline === false" class="px-2 py-0.5 text-xs rounded-full bg-red-500/20 text-red-300 font-medium border border-red-500/30">● API offline</span>
  </div>

  <!-- Métricas principales -->
  <div class="mb-6">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-3">

      <div class="bg-blue-600 rounded-lg p-5 shadow-sm hover:scale-[1.02] transition-transform">
        <p class="text-blue-100 text-xs mb-2">📄 Total Documentos Escaneados</p>
        <p class="text-4xl font-bold text-white" x-text="metricas.totalDocumentos ?? '—'"></p>
      </div>

      <div class="bg-emerald-600 rounded-lg p-5 shadow-sm hover:scale-[1.02] transition-transform">
        <p class="text-emerald-100 text-xs mb-2">📈 Completitud Promedio</p>
        <p class="text-4xl font-bold text-white"
           x-text="metricas.completitudPromedio != null ? metricas.completitudPromedio.toFixed(1) + '%' : '—'"></p>
      </div>

      <div class="bg-violet-600 rounded-lg p-5 shadow-sm hover:scale-[1.02] transition-transform">
        <p class="text-violet-100 text-xs mb-2">👥 Docentes Aptos</p>
        <p class="text-4xl font-bold text-white" x-text="metricas.docentesAptos ?? '—'"></p>
        <p class="text-violet-200 text-xs mt-1" x-text="metricas.docentesTotales != null ? 'de ' + metricas.docentesTotales : ''"></p>
      </div>

      <div class="bg-orange-500 rounded-lg p-5 shadow-sm hover:scale-[1.02] transition-transform">
        <p class="text-orange-100 text-xs mb-2">📊 Tasa de Completitud</p>
        <p class="text-4xl font-bold text-white"
           x-text="metricas.docentesTotales > 0 ? ((metricas.docentesAptos / metricas.docentesTotales) * 100).toFixed(0) + '%' : (metricas.docentesTotales === 0 ? '0%' : '—')"></p>
      </div>

    </div>

    <div class="flex items-center justify-between">
      <div x-show="errorMetricas" class="text-xs text-red-400 bg-red-500/10 border border-red-500/30 rounded px-3 py-1.5" x-text="errorMetricas"></div>
      <div class="ml-auto">
        <button @click="loadMetricas()" :disabled="loadingMetricas"
          class="px-3 py-1.5 text-xs border border-white/20 rounded-md hover:bg-white/10 disabled:opacity-50 transition-colors text-white/60">
          <span x-show="!loadingMetricas">↻ Actualizar métricas</span>
          <span x-show="loadingMetricas">Cargando...</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Banner pipeline activo -->
  <div x-show="pipeline.activo" class="mb-4 bg-amber-500/10 border border-amber-500/30 rounded-lg p-4 flex items-center justify-between">
    <div class="flex items-center gap-3 text-sm text-amber-300">
      <span class="font-medium">Pipeline en curso:</span>
      <template x-for="(paso, i) in pipeline.pasos" :key="paso.nombre">
        <span class="flex items-center gap-1">
          <span x-show="i > 0" class="text-amber-500/60">→</span>
          <span :class="{'font-semibold': paso.nombre === pipeline.pasoActual, 'text-green-400': paso.estado === 'ok', 'text-amber-300 animate-pulse': paso.estado === 'running', 'text-red-400': paso.estado === 'error'}" x-text="paso.label + (paso.estado === 'running' ? '...' : paso.estado === 'ok' && paso.fin ? ' (' + paso.fin + ')' : '')"></span>
        </span>
      </template>
    </div>
  </div>

  <!-- Botón ejecutar pipeline -->
  <div class="mb-6 flex items-center gap-3">
    <button
      @click="ejecutarPipeline()"
      :disabled="pipeline.activo"
      class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium rounded-lg text-sm transition-colors shadow-sm"
    >
      ▶ Ejecutar pipeline completo
    </button>
    <span class="text-xs text-white/40">Watcher → OCR → Classifier → Storage</span>
  </div>

  <!-- Agent Cards -->
  <h2 class="text-xs font-medium text-white/50 mb-3 uppercase tracking-widest">Agentes</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <template x-for="agente in agentes" :key="agente.nombre">
      <div class="bg-white/5 border border-white/10 rounded-lg p-4">
        <div class="flex items-start justify-between mb-2">
          <div>
            <div class="text-sm font-semibold text-white capitalize" x-text="agente.nombre + 'Agent'"></div>
            <div class="text-xs text-white/50 mt-0.5" x-text="agente.descripcion"></div>
          </div>
          <span
            :class="{
              'bg-green-500/20 text-green-300 border-green-500/30': agente.estado === 'idle',
              'bg-yellow-500/20 text-yellow-300 border-yellow-500/30 animate-pulse': agente.estado === 'running',
              'bg-red-500/20 text-red-300 border-red-500/30': agente.estado === 'error'
            }"
            class="px-2 py-0.5 text-xs rounded-full font-medium border"
            x-text="agente.estado"
          ></span>
        </div>
        <div class="text-xs text-white/40 mb-1">Último run: <span x-text="formatRelativeTime(agente.ultimo_run)"></span></div>
        <div class="text-xs text-white/40 mb-3">Procesados: <span x-text="agente.total_procesados ?? 0"></span></div>
        <div class="flex gap-2">
          <button
            @click="ejecutarAgente(agente.nombre, 'independiente')"
            :disabled="agente.estado === 'running'"
            class="flex-1 text-xs py-1.5 border border-white/20 rounded-md hover:bg-white/10 disabled:opacity-50 transition-colors text-white/70"
          >Solo</button>
          <button
            x-show="agente.nombre !== 'storage'"
            @click="ejecutarAgente(agente.nombre, 'pipeline')"
            :disabled="agente.estado === 'running'"
            class="flex-1 text-xs py-1.5 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50 transition-colors"
          >En cadena</button>
        </div>
      </div>
    </template>
  </div>

  <!-- Mini log viewer -->
  <div class="bg-white/5 border border-white/10 rounded-lg p-4">
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-sm font-medium text-white/80">Últimas entradas de log</h3>
      <a href="/ui/logs.html" class="text-xs text-blue-400 hover:text-blue-300 hover:underline transition-colors">Ver logs completos →</a>
    </div>
    <div class="bg-slate-950 border border-white/5 rounded-md p-3 h-48 overflow-y-auto font-mono text-xs" id="mini-log">
      <template x-for="(line, i) in miniLogs" :key="i">
        <div class="leading-5">
          <span class="text-slate-500" x-text="line.ts"></span>
          <span
            :class="{
              'text-green-400': line.nivel === 'INFO',
              'text-yellow-400': line.nivel === 'WARNING',
              'text-red-400': line.nivel === 'ERROR'
            }"
            x-text="' [' + line.nivel + '] '"
          ></span>
          <span class="text-slate-300" x-text="line.mensaje"></span>
        </div>
      </template>
      <div x-show="miniLogs.length === 0" class="text-slate-500 py-2">Conectando al stream de logs...</div>
    </div>
  </div>

</div>

<!-- Modal error agente -->
<div x-show="errorModal.visible" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50" x-cloak>
  <div class="bg-slate-800 rounded-lg border border-white/10 shadow-2xl p-6 max-w-md w-full mx-4">
    <h3 class="text-base font-semibold text-red-400 mb-2">Error en agente: <span x-text="errorModal.agente"></span></h3>
    <p class="text-sm text-white/70 mb-4 font-mono bg-red-500/10 border border-red-500/20 p-2 rounded" x-text="errorModal.mensaje"></p>
    <div class="flex gap-2 justify-end">
      <button @click="errorModal.visible = false" class="px-3 py-1.5 text-sm border border-white/20 rounded-md hover:bg-white/10 text-white/70">Cancelar</button>
      <button @click="reintentar()" class="px-3 py-1.5 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700">Reintentar</button>
    </div>
  </div>
</div>

<script>
const AGENTE_DESC = {
  watcher: "Gmail IMAP",
  ocr: "Extracción de texto",
  classifier: "Clasificación LLM",
  storage: "Persistencia MongoDB",
};

function dashApp() {
  return {
    apiOnline: null,
    metricas: {},
    loadingMetricas: false,
    errorMetricas: '',
    agentes: [],
    pipeline: {
      activo: false,
      pasoActual: null,
      pasos: [
        { nombre: "watcher", label: "Watcher", estado: "idle", fin: null },
        { nombre: "ocr", label: "OCR", estado: "idle", fin: null },
        { nombre: "classifier", label: "Classifier", estado: "idle", fin: null },
        { nombre: "storage", label: "Storage", estado: "idle", fin: null },
      ],
    },
    miniLogs: [],
    pollTimer: null,
    sseConn: null,
    errorModal: { visible: false, agente: "", mensaje: "" },

    async init() {
      requireAuth();
      await loadNav("dashboard");
      await Promise.all([this.checkHealth(), this.loadMetricas(), this.loadAgentes()]);
      this.startMiniSSE();
    },

    async checkHealth() {
      try {
        const r = await fetchApi("/health");
        this.apiOnline = r && r.ok;
      } catch { this.apiOnline = false; }
    },

    async loadMetricas() {
      this.loadingMetricas = true;
      this.errorMetricas = '';
      try {
        const r = await fetchApi("/metricas/");
        if (r && r.ok) {
          this.metricas = await r.json();
        } else {
          this.errorMetricas = 'Error al cargar métricas';
        }
      } catch (e) {
        this.errorMetricas = e.message || 'Error al cargar métricas';
      } finally {
        this.loadingMetricas = false;
      }
    },

    async loadAgentes() {
      try {
        const r = await fetchApi("/agentes");
        if (!r || !r.ok) return;
        const d = await r.json();
        const orden = ["watcher", "ocr", "classifier", "storage"];
        this.agentes = orden.map(nombre => {
          const a = (d.agentes || []).find(x => x.nombre === nombre) || {};
          return {
            nombre,
            descripcion: AGENTE_DESC[nombre] || "",
            estado: a.estado || "idle",
            ultimo_run: a.ultimo_run || null,
            total_procesados: a.total_procesados ?? null,
            error_msg: a.error_msg || "",
          };
        });

        if (d.pipeline_activo) {
          this.pipeline.activo = true;
          this.pipeline.pasoActual = d.pipeline_paso_actual;
          this.startPolling();
        }
      } catch {}
    },

    checkErrores() {
      this.agentes.forEach(a => {
        if (a.estado === "error" && a.error_msg) {
          this.errorModal = { visible: true, agente: a.nombre, mensaje: a.error_msg };
        }
      });
    },

    startPolling() {
      if (this.pollTimer) return;
      this.pollTimer = setInterval(async () => {
        await this.loadAgentes();
        this.checkErrores();
        const anyRunning = this.agentes.some(a => a.estado === "running");
        if (!anyRunning) {
          this.pipeline.activo = false;
          clearInterval(this.pollTimer);
          this.pollTimer = null;
        }
      }, 2000);
    },

    async ejecutarPipeline() {
      const r = await fetchApi("/agentes/watcher/ejecutar?modo=pipeline", { method: "POST" });
      if (r && r.ok) {
        this.pipeline.activo = true;
        this.pipeline.pasoActual = "watcher";
        this.pipeline.pasos.forEach(p => { p.estado = "idle"; p.fin = null; });
        showToast("Pipeline iniciado", "success");
        await this.loadAgentes();
        this.startPolling();
      } else {
        showToast("Error al iniciar pipeline", "error");
      }
    },

    async ejecutarAgente(nombre, modo) {
      const r = await fetchApi(`/agentes/${nombre}/ejecutar?modo=${modo}`, { method: "POST" });
      if (r && r.ok) {
        showToast(`${nombre} iniciado (${modo})`, "success");
        await this.loadAgentes();
        this.startPolling();
      } else {
        showToast(`Error al iniciar ${nombre}`, "error");
      }
    },

    async reintentar() {
      const nombre = this.errorModal.agente;
      this.errorModal.visible = false;
      await this.ejecutarAgente(nombre, "independiente");
    },

    startMiniSSE() {
      const token = getToken();
      if (!token) return;
      try {
        const es = new EventSource(`/logs/stream?token=${encodeURIComponent(token)}`);
        es.addEventListener("log", e => {
          try {
            const d = JSON.parse(e.data);
            this.miniLogs.unshift({ ts: d.timestamp?.slice(11, 19) || "", nivel: d.nivel || "INFO", mensaje: d.mensaje || "" });
            if (this.miniLogs.length > 10) this.miniLogs.pop();
          } catch {}
        });
        es.addEventListener("keepalive", () => {});
        this.sseConn = es;
      } catch {}
    },
  };
}
</script>
</body>
</html>
