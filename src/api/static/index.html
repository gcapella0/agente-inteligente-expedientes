<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — UNEG Expedientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>[x-cloak]{display:none!important}</style>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/ui/assets/app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
<div id="navbar"></div>

<div x-data="dashApp()" x-init="init()" class="pt-16 px-6 pb-10 max-w-6xl mx-auto">

  <!-- API Status -->
  <div class="mt-6 mb-4 flex items-center gap-3">
    <h1 class="text-xl font-semibold text-slate-800">Dashboard</h1>
    <span x-show="apiOnline === true" class="px-2 py-0.5 text-xs rounded-full bg-green-100 text-green-700 font-medium">● API online</span>
    <span x-show="apiOnline === false" class="px-2 py-0.5 text-xs rounded-full bg-red-100 text-red-700 font-medium">● API offline</span>
  </div>

  <!-- KPI Cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white border border-slate-200 rounded-lg p-4">
      <div class="text-2xl font-bold text-slate-800" x-text="kpis.totalDocentes ?? '—'"></div>
      <div class="text-xs text-slate-500 mt-1">Total docentes</div>
    </div>
    <div class="bg-white border border-slate-200 rounded-lg p-4">
      <div class="text-2xl font-bold text-slate-800" x-text="kpis.totalDocumentos ?? '—'"></div>
      <div class="text-xs text-slate-500 mt-1">Total documentos</div>
    </div>
    <div class="bg-white border border-slate-200 rounded-lg p-4">
      <div class="text-2xl font-bold text-slate-800" x-text="kpis.completitudPromedio != null ? kpis.completitudPromedio + '%' : '—'"></div>
      <div class="text-xs text-slate-500 mt-1">Completitud promedio</div>
    </div>
    <div class="bg-white border border-slate-200 rounded-lg p-4">
      <div class="text-2xl font-bold text-slate-800" x-text="kpis.docentesAptos ?? '—'"></div>
      <div class="text-xs text-slate-500 mt-1">Docentes aptos</div>
    </div>
  </div>

  <!-- Banner pipeline activo -->
  <div x-show="pipeline.activo" class="mb-4 bg-amber-50 border border-amber-200 rounded-lg p-4 flex items-center justify-between">
    <div class="flex items-center gap-3 text-sm text-amber-800">
      <span class="font-medium">Pipeline en curso:</span>
      <template x-for="(paso, i) in pipeline.pasos" :key="paso.nombre">
        <span class="flex items-center gap-1">
          <span x-show="i > 0" class="text-amber-400">→</span>
          <span :class="{'font-semibold': paso.nombre === pipeline.pasoActual, 'text-green-700': paso.estado === 'ok', 'text-amber-700 animate-pulse': paso.estado === 'running', 'text-red-600': paso.estado === 'error'}" x-text="paso.label + (paso.estado === 'running' ? '...' : paso.estado === 'ok' && paso.fin ? ' (' + paso.fin + ')' : '')"></span>
        </span>
      </template>
    </div>
  </div>

  <!-- Botón ejecutar pipeline -->
  <div class="mb-6 flex items-center gap-3">
    <button
      @click="ejecutarPipeline()"
      :disabled="pipeline.activo"
      class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium rounded-lg text-sm transition-colors shadow-sm"
    >
      ▶ Ejecutar pipeline completo
    </button>
    <span class="text-xs text-slate-500">Watcher → OCR → Classifier → Storage</span>
  </div>

  <!-- Agent Cards -->
  <h2 class="text-sm font-medium text-slate-600 mb-3 uppercase tracking-wide">Agentes</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <template x-for="agente in agentes" :key="agente.nombre">
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <div class="flex items-start justify-between mb-2">
          <div>
            <div class="text-sm font-semibold text-slate-800 capitalize" x-text="agente.nombre + 'Agent'"></div>
            <div class="text-xs text-slate-500 mt-0.5" x-text="agente.descripcion"></div>
          </div>
          <span
            :class="{
              'bg-green-100 text-green-700': agente.estado === 'idle',
              'bg-yellow-100 text-yellow-700 animate-pulse': agente.estado === 'running',
              'bg-red-100 text-red-700': agente.estado === 'error'
            }"
            class="px-2 py-0.5 text-xs rounded-full font-medium"
            x-text="agente.estado"
          ></span>
        </div>
        <div class="text-xs text-slate-400 mb-1">Último run: <span x-text="formatRelativeTime(agente.ultimo_run)"></span></div>
        <div class="text-xs text-slate-400 mb-3">Procesados: <span x-text="agente.total_procesados ?? 0"></span></div>
        <div class="flex gap-2">
          <button
            @click="ejecutarAgente(agente.nombre, 'independiente')"
            :disabled="agente.estado === 'running'"
            class="flex-1 text-xs py-1.5 border border-slate-300 rounded-md hover:bg-slate-50 disabled:opacity-50 transition-colors text-slate-700"
          >Solo</button>
          <button
            x-show="agente.nombre !== 'storage'"
            @click="ejecutarAgente(agente.nombre, 'pipeline')"
            :disabled="agente.estado === 'running'"
            class="flex-1 text-xs py-1.5 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50 transition-colors"
          >En cadena</button>
        </div>
      </div>
    </template>
  </div>

  <!-- Mini log viewer -->
  <div class="bg-white border border-slate-200 rounded-lg p-4">
    <div class="flex items-center justify-between mb-2">
      <h3 class="text-sm font-medium text-slate-700">Últimas entradas de log</h3>
      <a href="/ui/logs.html" target="_blank" class="text-xs text-blue-600 hover:underline">Ver logs completos →</a>
    </div>
    <div class="bg-slate-800 rounded-md p-3 h-40 overflow-y-auto font-mono text-xs" id="mini-log">
      <template x-for="(line, i) in miniLogs" :key="i">
        <div class="leading-5">
          <span class="text-slate-400" x-text="line.ts"></span>
          <span
            :class="{
              'text-green-400': line.nivel === 'INFO',
              'text-yellow-400': line.nivel === 'WARNING',
              'text-red-400': line.nivel === 'ERROR'
            }"
            x-text="' [' + line.nivel + '] '"
          ></span>
          <span class="text-slate-300" x-text="line.mensaje"></span>
        </div>
      </template>
      <div x-show="miniLogs.length === 0" class="text-slate-500">Sin entradas de log aún...</div>
    </div>
  </div>

</div>

<!-- Modal error agente -->
<div x-show="errorModal.visible" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" x-cloak>
  <div class="bg-white rounded-lg border border-slate-200 shadow-xl p-6 max-w-md w-full mx-4">
    <h3 class="text-base font-semibold text-red-700 mb-2">Error en agente: <span x-text="errorModal.agente"></span></h3>
    <p class="text-sm text-slate-600 mb-4 font-mono bg-red-50 p-2 rounded" x-text="errorModal.mensaje"></p>
    <div class="flex gap-2 justify-end">
      <button @click="errorModal.visible = false" class="px-3 py-1.5 text-sm border border-slate-300 rounded-md hover:bg-slate-50">Cancelar</button>
      <button @click="reintentar()" class="px-3 py-1.5 text-sm bg-blue-600 text-white rounded-md hover:bg-blue-700">Reintentar</button>
    </div>
  </div>
</div>

<script>
const AGENTE_DESC = {
  watcher: "Gmail IMAP",
  ocr: "Extracción de texto",
  classifier: "Clasificación LLM",
  storage: "Persistencia MongoDB",
};

function dashApp() {
  return {
    apiOnline: null,
    kpis: {},
    agentes: [],
    pipeline: {
      activo: false,
      pasoActual: null,
      pasos: [
        { nombre: "watcher", label: "Watcher", estado: "idle", fin: null },
        { nombre: "ocr", label: "OCR", estado: "idle", fin: null },
        { nombre: "classifier", label: "Classifier", estado: "idle", fin: null },
        { nombre: "storage", label: "Storage", estado: "idle", fin: null },
      ],
    },
    miniLogs: [],
    pollTimer: null,
    sseConn: null,
    errorModal: { visible: false, agente: "", mensaje: "" },

    async init() {
      requireAuth();
      await loadNav("dashboard");
      await Promise.all([this.checkHealth(), this.loadKPIs(), this.loadAgentes()]);
      this.startMiniSSE();
    },

    async checkHealth() {
      try {
        const r = await fetchApi("/health");
        this.apiOnline = r && r.ok;
      } catch { this.apiOnline = false; }
    },

    async loadKPIs() {
      try {
        const [rExp, rDoc, rComp] = await Promise.all([
          fetchApi("/estadisticas/expedientes?agrupar_por=status"),
          fetchApi("/estadisticas/documentos"),
          fetchApi("/estadisticas/completitud"),
        ]);
        if (rExp && rExp.ok) {
          const d = await rExp.json();
          this.kpis.totalDocentes = d.total_docentes ?? 0;
          const aptos = (d.datos || []).find(x => x.categoria === "activo");
          this.kpis.docentesAptos = aptos ? aptos.cantidad : 0;
        }
        if (rDoc && rDoc.ok) {
          const d = await rDoc.json();
          this.kpis.totalDocumentos = d.total_documentos ?? 0;
        }
        if (rComp && rComp.ok) {
          const d = await rComp.json();
          this.kpis.completitudPromedio = d.promedio_general != null
            ? Math.round(d.promedio_general)
            : null;
        }
      } catch {}
    },

    async loadAgentes() {
      try {
        const r = await fetchApi("/agentes");
        if (!r || !r.ok) return;
        const d = await r.json();
        const orden = ["watcher", "ocr", "classifier", "storage"];
        this.agentes = orden.map(nombre => {
          const a = (d.agentes || []).find(x => x.nombre === nombre) || {};
          return {
            nombre,
            descripcion: AGENTE_DESC[nombre] || "",
            estado: a.estado || "idle",
            ultimo_run: a.ultimo_run || null,
            total_procesados: a.total_procesados ?? null,
            error_msg: a.error_msg || "",
          };
        });

        if (d.pipeline_activo) {
          this.pipeline.activo = true;
          this.pipeline.pasoActual = d.pipeline_paso_actual;
          this.startPolling();
        }
      } catch {}
    },

    checkErrores() {
      this.agentes.forEach(a => {
        if (a.estado === "error" && a.error_msg) {
          this.errorModal = { visible: true, agente: a.nombre, mensaje: a.error_msg };
        }
      });
    },

    startPolling() {
      if (this.pollTimer) return;
      this.pollTimer = setInterval(async () => {
        await this.loadAgentes();
        this.checkErrores();
        const anyRunning = this.agentes.some(a => a.estado === "running");
        if (!anyRunning) {
          this.pipeline.activo = false;
          clearInterval(this.pollTimer);
          this.pollTimer = null;
        }
      }, 2000);
    },

    async ejecutarPipeline() {
      const r = await fetchApi("/agentes/watcher/ejecutar?modo=pipeline", { method: "POST" });
      if (r && r.ok) {
        this.pipeline.activo = true;
        this.pipeline.pasoActual = "watcher";
        this.pipeline.pasos.forEach(p => { p.estado = "idle"; p.fin = null; });
        showToast("Pipeline iniciado", "success");
        await this.loadAgentes();
        this.startPolling();
      } else {
        showToast("Error al iniciar pipeline", "error");
      }
    },

    async ejecutarAgente(nombre, modo) {
      const r = await fetchApi(`/agentes/${nombre}/ejecutar?modo=${modo}`, { method: "POST" });
      if (r && r.ok) {
        showToast(`${nombre} iniciado (${modo})`, "success");
        await this.loadAgentes();
        this.startPolling();
      } else {
        showToast(`Error al iniciar ${nombre}`, "error");
      }
    },

    async reintentar() {
      const nombre = this.errorModal.agente;
      this.errorModal.visible = false;
      await this.ejecutarAgente(nombre, "independiente");
    },

    startMiniSSE() {
      const token = getToken();
      if (!token) return;
      try {
        const es = new EventSource(`/logs/stream?token=${encodeURIComponent(token)}`);
        es.addEventListener("log", e => {
          try {
            const d = JSON.parse(e.data);
            this.miniLogs.unshift({ ts: d.timestamp?.slice(11, 19) || "", nivel: d.nivel || "INFO", mensaje: d.mensaje || "" });
            if (this.miniLogs.length > 10) this.miniLogs.pop();
          } catch {}
        });
        es.addEventListener("keepalive", () => {});
        this.sseConn = es;
      } catch {}
    },
  };
}
</script>
</body>
</html>
