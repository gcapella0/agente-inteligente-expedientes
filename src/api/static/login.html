<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar — UNEG Expedientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/ui/assets/app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">

<div x-data="loginApp()" class="w-full max-w-sm">
  <div class="bg-white border border-slate-200 rounded-lg shadow-sm p-8">
    <div class="mb-6 text-center">
      <h1 class="text-lg font-semibold text-slate-800">Agente Inteligente de Expedientes</h1>
      <p class="text-sm text-slate-500 mt-1">Universidad Nacional Experimental de Guayana</p>
    </div>

    <form @submit.prevent="doLogin">
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
        <input
          x-model="email"
          type="email"
          autocomplete="email"
          class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="admin@uneg.edu.ve"
          required
        />
      </div>
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input
          x-model="password"
          type="password"
          autocomplete="current-password"
          class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="••••••••"
          required
        />
      </div>

      <div x-show="error" class="mb-4 px-3 py-2 bg-red-50 border border-red-200 rounded-md text-sm text-red-600" x-text="error"></div>

      <button
        type="submit"
        :disabled="loading"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-medium py-2 px-4 rounded-md text-sm transition-colors"
      >
        <span x-show="!loading">Ingresar</span>
        <span x-show="loading">Ingresando...</span>
      </button>
    </form>
  </div>
</div>

<script>
function loginApp() {
  return {
    email: "admin@uneg.edu.ve",
    password: "",
    loading: false,
    error: "",

    async doLogin() {
      this.error = "";
      this.loading = true;
      try {
        const resp = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: this.email, password: this.password }),
        });
        if (resp.ok) {
          const data = await resp.json();
          setToken(data.access_token);
          window.location.href = "/ui/index.html";
        } else {
          const data = await resp.json().catch(() => ({}));
          this.error = data.detail || "Credenciales incorrectas";
        }
      } catch (e) {
        this.error = "Error de conexión con el servidor";
      } finally {
        this.loading = false;
      }
    }
  };
}
</script>

</body>
</html>
