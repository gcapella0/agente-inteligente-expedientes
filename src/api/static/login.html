<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Expedientes Docentes UNEG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/ui/assets/app.js"></script>
  <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

<div x-data="loginForm()" class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Fondo decorativo -->
  <div class="absolute -top-40 -right-40 w-80 h-80 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>
  <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>

  <div class="relative max-w-md w-full">

    <!-- Logo y Título -->
    <div class="text-center mb-8">
      <!-- Logo UNEG -->
      <div class="flex justify-center mb-4">
        <div class="w-24 h-24 rounded-full bg-white flex items-center justify-center shadow-lg shadow-blue-500/20 ring-2 ring-white/20">
          <img src="/ui/assets/logo_uneg.png" alt="Logo UNEG" class="w-16 h-16 object-contain" />
        </div>
      </div>
      <h1 class="text-3xl font-bold text-white">Expedientes Docentes</h1>
      <p class="text-blue-300 text-sm mt-1 tracking-widest uppercase">UNEG</p>
    </div>

    <!-- Form Container -->
    <div class="bg-white/5 backdrop-blur-md rounded-2xl border border-white/10 p-8 shadow-2xl">

      <!-- Error -->
      <div x-show="error" x-cloak class="mb-6 p-4 bg-red-500/10 border border-red-500/30 rounded-lg flex items-start gap-3">
        <svg class="w-5 h-5 text-red-400 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
        <p class="text-red-300 text-sm" x-text="error"></p>
      </div>

      <!-- Success -->
      <div x-show="success" x-cloak class="mb-6 p-4 bg-green-500/10 border border-green-500/30 rounded-lg flex items-start gap-3">
        <svg class="w-5 h-5 text-green-400 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <p class="text-green-300 text-sm" x-text="success"></p>
      </div>

      <!-- Form -->
      <form @submit.prevent="handleLogin()" class="space-y-5">

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-white/80 mb-2">Correo electrónico</label>
          <input
            type="email"
            x-model="email"
            autocomplete="email"
            placeholder="admin@uneg.edu.ve"
            :class="emailError ? 'border-red-500/60 focus:border-red-400 focus:ring-red-500/20' : 'border-white/10 focus:border-blue-400 focus:ring-blue-500/20'"
            class="w-full px-4 py-3 bg-white/5 border rounded-lg text-white placeholder-white/30 focus:outline-none focus:ring-2 transition"
          />
          <p x-show="emailError" x-cloak class="mt-1.5 text-xs text-red-400" x-text="emailError"></p>
        </div>

        <!-- Password con toggle -->
        <div>
          <label class="block text-sm font-medium text-white/80 mb-2">Contraseña</label>
          <div class="relative">
            <input
              :type="mostrarPassword ? 'text' : 'password'"
              x-model="password"
              autocomplete="current-password"
              placeholder="••••••••"
              :class="passwordError ? 'border-red-500/60 focus:border-red-400 focus:ring-red-500/20' : 'border-white/10 focus:border-blue-400 focus:ring-blue-500/20'"
              class="w-full px-4 py-3 pr-12 bg-white/5 border rounded-lg text-white placeholder-white/30 focus:outline-none focus:ring-2 transition"
            />
            <button
              type="button"
              @click="mostrarPassword = !mostrarPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-white/40 hover:text-white/80 transition"
              :aria-label="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <!-- Eye -->
              <svg x-show="!mostrarPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <!-- EyeOff -->
              <svg x-show="mostrarPassword" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
              </svg>
            </button>
          </div>
          <p x-show="passwordError" x-cloak class="mt-1.5 text-xs text-red-400" x-text="passwordError"></p>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          :disabled="loading"
          class="w-full py-3 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 disabled:from-blue-500/50 disabled:to-blue-600/50 disabled:cursor-not-allowed text-white font-semibold rounded-lg transition duration-200 flex items-center justify-center gap-2"
        >
          <svg x-show="loading" x-cloak class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
          </svg>
          <span x-show="!loading">Iniciar Sesión</span>
          <span x-show="loading" x-cloak>Verificando...</span>
        </button>
      </form>

      <!-- Enlace recuperar contraseña -->
      <div class="mt-4 text-center">
        <button type="button" @click="recoveryModal = true"
                class="text-sm text-blue-300 hover:text-blue-200 hover:underline transition-colors">
          ¿Olvidaste tu contraseña?
        </button>
      </div>

    </div>

    <!-- Footer -->
    <div class="mt-6 text-center text-white/40 text-xs space-y-1">
      <p>Sistema de gestión de expedientes docentes</p>
      <p>v2.2.0 © 2026 UNEG</p>
    </div>

  </div>

  <!-- Modal recuperar contraseña -->
  <div x-show="recoveryModal" x-cloak class="fixed inset-0 bg-slate-900/90 flex items-center justify-center z-50">
    <div class="bg-slate-800 border border-white/10 rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4">
      <h3 class="text-base font-semibold text-white mb-3">Recuperar contraseña</h3>
      <p class="text-sm text-white/70 mb-2">
        Para restablecer tu contraseña, contactá al administrador del sistema:
      </p>
      <p class="text-sm text-blue-300 font-medium mb-5">admin@uneg.edu.ve</p>
      <div class="flex justify-end">
        <button @click="recoveryModal = false"
                class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors">
          Entendido
        </button>
      </div>
    </div>
  </div>

</div>

<script>
function loginForm() {
  return {
    email: '',
    password: '',
    mostrarPassword: false,
    loading: false,
    error: '',
    success: '',
    emailError: '',
    passwordError: '',
    recoveryModal: false,

    validar() {
      this.emailError = '';
      this.passwordError = '';
      let ok = true;

      if (!this.email.trim()) {
        this.emailError = 'El correo electrónico es requerido';
        ok = false;
      } else if (!this.email.includes('@')) {
        this.emailError = 'El correo electrónico no es válido';
        ok = false;
      }

      if (!this.password) {
        this.passwordError = 'La contraseña es requerida';
        ok = false;
      } else if (this.password.length < 6) {
        this.passwordError = 'La contraseña debe tener al menos 6 caracteres';
        ok = false;
      }

      return ok;
    },

    async handleLogin() {
      this.error = '';
      this.success = '';

      if (!this.validar()) return;

      this.loading = true;
      try {
        const resp = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: this.email, password: this.password }),
        });

        if (resp.ok) {
          const data = await resp.json();
          localStorage.setItem('token', data.access_token);
          this.success = 'Acceso correcto. Redirigiendo...';
          setTimeout(() => { window.location.href = '/ui'; }, 1500);
        } else {
          const data = await resp.json().catch(() => ({}));
          this.error = data.detail || 'Credenciales incorrectas';
        }
      } catch {
        this.error = 'Error de conexión con el servidor';
      } finally {
        this.loading = false;
      }
    }
  };
}
</script>

</body>
</html>
